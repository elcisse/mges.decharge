name: Build executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  APP_NAME: DechargeMGES
  APP_VERSION: 1.0.0
  MAIN_CLASS: com.mges.decharge.Launcher
  ADD_MODULES: java.desktop,java.logging,java.sql,java.naming,java.xml,java.prefs,java.scripting,jdk.unsupported

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Package Windows executable
        shell: pwsh
        run: |
          $jar = Get-ChildItem target -Filter "decharge-mges-*.jar" | Select-Object -First 1
          jpackage `
            --type exe `
            --name "$env:APP_NAME" `
            --app-version "$env:APP_VERSION" `
            --vendor "MGES" `
            --input target `
            --main-jar $jar.Name `
            --main-class "$env:MAIN_CLASS" `
            --dest dist `
            --add-modules "$env:ADD_MODULES" `
            --win-shortcut `
            --win-menu

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/*.exe

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Package macOS executable
        run: |
          JAR=$(ls target/decharge-mges-*.jar | head -n1)
          jpackage \
            --type dmg \
            --name "$APP_NAME" \
            --app-version "$APP_VERSION" \
            --vendor "MGES" \
            --input target \
            --main-jar "$(basename "$JAR")" \
            --main-class "$MAIN_CLASS" \
            --dest dist \
            --add-modules "$ADD_MODULES"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-intel
          path: dist/*.dmg

  release:
    needs: [ build-windows, build-macos-intel ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release with executables
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ env.APP_NAME }}-windows/*.exe
            artifacts/${{ env.APP_NAME }}-macos-intel/*.dmg
